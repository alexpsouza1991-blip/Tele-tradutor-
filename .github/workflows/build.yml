name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gerar projeto Android
        run: |
          mkdir -p app/src/main/java/com/example/teletradutor

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "TeleTradutor"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.teletradutor"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.teletradutor"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <application
                  android:largeHeap="true"
                  android:label="Tele Tradutor"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/teletradutor/MainActivity.kt <<'EOF'
          package com.example.teletradutor

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.webkit.JavascriptInterface
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder

          class MainActivity : Activity() {

              private lateinit var web: WebView
              private var fileCallback: ValueCallback<Array<Uri>>? = null

              inner class Bridge {
                  @JavascriptInterface
                  fun translate(id: String, text: String, target: String) {
                      Thread {
                          val out = try { doTranslate(text, target) } catch (e: Exception) { "" }
                          runOnUiThread {
                              web.evaluateJavascript(
                                  "window.__ttDone(" + JSONObject.quote(id) + "," + JSONObject.quote(out) + ")",
                                  null
                              )
                          }
                      }.start()
                  }

                  @JavascriptInterface
                  fun getTarget(): String =
                      getSharedPreferences("tt", MODE_PRIVATE).getString("lang", "en") ?: "en"

                  @JavascriptInterface
                  fun setTarget(l: String) {
                      getSharedPreferences("tt", MODE_PRIVATE).edit().putString("lang", l).apply()
                  }
              }

              private fun doTranslate(text: String, target: String): String {
                  val url = URL(
                      "https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=" +
                          URLEncoder.encode(target, "UTF-8") + "&dt=t&q=" + URLEncoder.encode(text, "UTF-8")
                  )
                  val c = url.openConnection() as HttpURLConnection
                  c.connectTimeout = 10000
                  c.readTimeout = 15000
                  c.setRequestProperty("User-Agent", "Mozilla/5.0")
                  val body = c.inputStream.bufferedReader().readText()
                  val arr = JSONArray(body).getJSONArray(0)
                  val sb = StringBuilder()
                  for (i in 0 until arr.length()) sb.append(arr.getJSONArray(i).getString(0))
                  return sb.toString()
              }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  web = WebView(this)
                  setContentView(web)

                  val s = web.settings
                  s.javaScriptEnabled = true
                  s.domStorageEnabled = true
                  s.mediaPlaybackRequiresUserGesture = false
                  s.allowFileAccess = true
                  s.allowContentAccess = true
                  s.cacheMode = WebSettings.LOAD_DEFAULT

                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(
                          arrayOf("android.permission.READ_MEDIA_IMAGES", "android.permission.READ_MEDIA_VIDEO"),
                          2
                      )
                  } else if (Build.VERSION.SDK_INT >= 23) {
                      requestPermissions(arrayOf("android.permission.READ_EXTERNAL_STORAGE"), 2)
                  }

                  web.addJavascriptInterface(Bridge(), "TT")

                  web.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(v: WebView, r: WebResourceRequest): Boolean {
                          val h = r.url.host ?: return true
                          return !(h == "telegram.org" || h.endsWith(".telegram.org"))
                      }

                      override fun onPageFinished(v: WebView, url: String?) {
                          v.evaluateJavascript(INJECT, null)
                      }
                  }

                  web.webChromeClient = object : WebChromeClient() {
                      override fun onShowFileChooser(
                          w: WebView,
                          cb: ValueCallback<Array<Uri>>,
                          p: FileChooserParams
                      ): Boolean {
                          fileCallback?.onReceiveValue(null)
                          fileCallback = cb
                          return try {
                              val i = Intent(Intent.ACTION_GET_CONTENT)
                              i.addCategory(Intent.CATEGORY_OPENABLE)
                              i.type = "*/*"
                              val types = p.acceptTypes.filter { it.contains("/") }
                              if (types.isNotEmpty()) i.putExtra(Intent.EXTRA_MIME_TYPES, types.toTypedArray())
                              i.putExtra(
                                  Intent.EXTRA_ALLOW_MULTIPLE,
                                  p.mode == WebChromeClient.FileChooserParams.MODE_OPEN_MULTIPLE
                              )
                              startActivityForResult(Intent.createChooser(i, "Escolher arquivo"), 1)
                              true
                          } catch (e: Exception) {
                              fileCallback = null
                              false
                          }
                      }
                  }

                  web.loadUrl("https://web.telegram.org/k/")
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  if (requestCode == 1) {
                      fileCallback?.onReceiveValue(
                          WebChromeClient.FileChooserParams.parseResult(resultCode, data)
                      )
                      fileCallback = null
                  } else {
                      super.onActivityResult(requestCode, resultCode, data)
                  }
              }

              override fun onBackPressed() {
                  if (web.canGoBack()) web.goBack() else super.onBackPressed()
              }
          }

          private const val INJECT = """
          (function () {
            if (window.__ttInit) return;
            window.__ttInit = true;
            try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
            var IN_LANG = 'pt';
            var LANGS = ['en', 'es', 'fr', 'de', 'it', 'ru', 'ar', 'zh-CN', 'ja'];
            var cbs = {};
            var n = 0;

            window.__ttDone = function (id, out) {
              var f = cbs[id];
              delete cbs[id];
              if (f) f(out);
            };

            function tr(text, target, cb) {
              var id = 'r' + (++n);
              cbs[id] = cb;
              TT.translate(id, text.slice(0, 1500), target);
            }

            function mk(label, bottom, fn) {
              var b = document.createElement('button');
              b.textContent = label;
              b.style.cssText = 'position:fixed;left:8px;bottom:' + bottom +
                'px;z-index:99999;padding:8px 12px;border-radius:18px;border:0;' +
                'background:#3390ec;color:#fff;font-size:13px;opacity:.92';
              b.addEventListener('click', fn);
              document.body.appendChild(b);
              return b;
            }

            function getInput() {
              return document.querySelector('.input-message-container [contenteditable="true"]') ||
                     document.querySelector('.input-message-input[contenteditable="true"]') ||
                     document.querySelector('[contenteditable="true"]');
            }

            mk('\uD83D\uDD0D Buscar no grupo', 202, function () {
              var b = document.querySelector('.chat-utils [class*="tgico-search"]') ||
                      document.querySelector('.chat-info-container [class*="tgico-search"]') ||
                      document.querySelector('[class*="tgico-search"]');
              if (b) b.click();
            });

            mk('\uD83C\uDF10 Traduzir recebidas', 160, function () {
              var nodes = document.querySelectorAll('.bubble:not(.is-out) .message');
              var count = 0;
              for (var i = nodes.length - 1; i >= 0 && count < 20; i--) {
                var node = nodes[i];
                if (node.dataset.tt) continue;
                var r = node.getBoundingClientRect();
                if (r.bottom < 0 || r.top > window.innerHeight) continue;
                var clone = node.cloneNode(true);
                var junk = clone.querySelectorAll('.time, .reactions, .reply-markup');
                for (var j = 0; j < junk.length; j++) junk[j].remove();
                var text = (clone.textContent || '').trim();
                if (!text) continue;
                node.dataset.tt = '1';
                count++;
                (function (nd) {
                  var d = document.createElement('div');
                  d.style.cssText = 'margin-top:4px;padding:4px 6px;border-left:3px solid #3390ec;' +
                    'font-size:.92em;opacity:.9';
                  d.textContent = '...';
                  nd.parentNode.insertBefore(d, nd.nextSibling);
                  tr(text, IN_LANG, function (out) {
                    d.textContent = out || '\u26A0 falha ao traduzir';
                  });
                })(node);
              }
            });

            var sendBtn = mk('\u270D\uFE0F Traduzir p/ ' + TT.getTarget(), 118, function () {
              var inp = getInput();
              if (!inp) return;
              var t = (inp.innerText || '').trim();
              if (!t) return;
              sendBtn.textContent = '...';
              tr(t, TT.getTarget(), function (out) {
                sendBtn.textContent = '\u270D\uFE0F Traduzir p/ ' + TT.getTarget();
                if (!out) return;
                inp.focus();
                inp.textContent = out;
                inp.dispatchEvent(new InputEvent('input', { bubbles: true }));
              });
            });

            var langBtn = mk('\uD83D\uDD01 Idioma: ' + TT.getTarget(), 76, function () {
              var i = (LANGS.indexOf(TT.getTarget()) + 1) % LANGS.length;
              TT.setTarget(LANGS[i]);
              langBtn.textContent = '\uD83D\uDD01 Idioma: ' + LANGS[i];
              sendBtn.textContent = '\u270D\uFE0F Traduzir p/ ' + LANGS[i];
            });
          })();
          """
          EOF

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: TeleTradutor-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Tele Tradutor ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
